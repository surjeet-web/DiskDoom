.L-apps{animation:fa 6s var(--soft) infinite}
.L-docs{animation:fb 4s var(--soft) -1.3s infinite}
.L-sys{animation:fb 6s var(--soft) -2s infinite}
.L-down{animation:fa 4s var(--soft) -.6s infinite}
.L-stack{animation:fb 3s var(--soft) -1s infinite}
@keyframes fa{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(1px,-6px) rotate(.5deg)}}
@keyframes fb{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-1px,5px) rotate(-.5deg)}}
/* platter scan */
.plat{left:268px;top:199px;width:464px;height:326px;transform:rotate(-4deg);mix-blend-mode:screen;pointer-events:none}
.plat .disc{left:0;top:-69px;width:464px;height:464px;border-radius:50%;transform:scaleY(.7026);
 background:conic-gradient(from 0deg,rgba(255,110,40,0) 0deg,rgba(255,110,40,0) 230deg,rgba(255,120,50,.28) 320deg,rgba(255,170,90,.6) 352deg,rgba(255,240,210,.9) 359deg,rgba(255,255,255,0) 360deg);
 -webkit-mask:radial-gradient(circle,transparent 0 31%,#000 36% 94%,transparent 99%);mask:radial-gradient(circle,transparent 0 31%,#000 36% 94%,transparent 99%);
 animation:sweep 6s linear infinite}
@keyframes sweep{to{transform:scaleY(.7026) rotate(360deg)}}
.glow{border-radius:50%;pointer-events:none;mix-blend-mode:screen}
.g1{left:412px;top:246px;width:176px;height:176px;background:radial-gradient(circle,rgba(255,170,90,.45),transparent 65%);animation:pulse 3s var(--soft) infinite}
.g2{left:610px;top:215px;width:140px;height:110px;background:radial-gradient(circle,rgba(255,200,140,.55),transparent 62%);animation:pulse 3s var(--soft) -1.5s infinite}
.g3{left:330px;top:610px;width:260px;height:130px;background:radial-gradient(ellipse,rgba(255,80,20,.45),transparent 65%);animation:pulse 6s var(--soft) infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
/* radar */
.radar{left:660px;top:610px;width:74px;height:74px;border-radius:50%;mix-blend-mode:screen;
 background:conic-gradient(rgba(255,90,30,0) 0 230deg,rgba(255,110,40,.55) 330deg,rgba(255,220,180,.95) 359deg,rgba(255,90,30,0));
 -webkit-mask:radial-gradient(circle,transparent 0 22%,#000 26% 92%,transparent 100%);mask:radial-gradient(circle,transparent 0 22%,#000 26% 92%,transparent 100%);animation:rot 3s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
/* bars */
.bar{height:7px;border-radius:4px;background:#232842;transform-origin:0 50%;overflow:hidden}
.bar i{left:0;top:0;height:100%;width:0;border-radius:4px}
.num{font:500 12.5px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#dfe3f2;white-space:nowrap;transform-origin:100% 50%;transform:translate(-100%,-50%) rotate(7deg)}
#cv{left:0;top:0;pointer-events:none;mix-blend-mode:screen}

</div></div>
<script>
const st=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1024,innerHeight/807);st.style.transform=`scale(${s}) translate(-512px,-403.5px)`}
addEventListener('resize',fit);fit();
const bars=[...document.querySelectorAll('.bar i')],nums=[...document.querySelectorAll('.num')];
const tgt=[.52,.41,.265,.327,1],val=[42.6,28.3,18.7,12.4],starts=[.4,.9,1.4,1.9,.3],dur=[5,4.5,4,3.5,10];
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const P=Array.from({length:70},()=>({}));
const zones=[[200,10,260,120],[560,30,320,150],[10,200,180,230],[840,250,170,200],[700,230,80,120]];
function spawn(p,init){const z=zones[Math.random()*zones.length|0];p.x=z[0]+Math.random()*z[2];p.y=z[1]+Math.random()*z[3];
 p.vy=-(.1+Math.random()*.35);p.vx=(Math.random()-.5)*.2;p.s=1+Math.random()*2.2;p.l=0;p.max=240+Math.random()*300;
 p.c=Math.random()<.78?'255,110,40':'80,140,255';if(init)p.l=Math.random()*p.max}
P.forEach(p=>spawn(p,1));
let T0=performance.now(),run=true;
document.addEventListener('visibilitychange',()=>{run=!document.hidden;if(run)requestAnimationFrame(tick)});
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function tick(now){if(!run)return;const t=((now-T0)/1000)%12;
 for(let i=0;i<5;i++){let f=ease((t-starts[i])/dur[i]);if(t>11.2)f*=Math.max(0,(12-t)/.8);
  bars[i].style.width=(rm?tgt[i]:tgt[i]*f)*100+'%';
  if(i<4)nums[i].textContent=(val[i]*(rm?1:f/ 1)).toFixed(1)+' GB';}
 cx.clearRect(0,0,1024,807);
 if(!rm)for(const p of P){p.l++;p.x+=p.vx;p.y+=p.vy;if(p.l>p.max)spawn(p,0);
  const a=Math.sin(Math.PI*p.l/p.max)*(.5+.5*Math.sin(p.l*.15+p.s));
  cx.fillStyle=`rgba(${p.c},${(a*.9).toFixed(3)})`;cx.fillRect(p.x,p.y,p.s,p.s)}
 requestAnimationFrame(tick)}
requestAnimationFrame(tick);
</script></body></html>
