<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten screen structural wireframes</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#fff;overflow-x:hidden}
  main{width:100%;min-height:100vh;display:grid;place-items:center;padding:clamp(8px,1vw,26px)}
  svg{display:block;width:min(100%,1850px);height:auto;aspect-ratio:1672/941;overflow:visible;touch-action:manipulation}
  svg *{vector-effect:non-scaling-stroke}
  .wire{fill:none;stroke:#111;stroke-width:1.5;stroke-linejoin:bevel;stroke-linecap:round}
  .hair{fill:none;stroke:#111;stroke-width:.85;stroke-linejoin:bevel;stroke-linecap:round;opacity:.65}
  .heavy{fill:none;stroke:#111;stroke-width:2.65;stroke-linejoin:bevel;stroke-linecap:round}
  .solid{fill:#111;stroke:none}
  .paper{fill:#fff;stroke:none}
  .screen{cursor:zoom-in;transition:opacity .2s ease}
  .screen:focus{outline:none}
  .screen:focus-visible>.focus-ring{stroke-width:3;opacity:1}
  .focus-ring{pointer-events:none;opacity:0;fill:none;stroke:#111;stroke-dasharray:9 5;stroke-width:1}
  @media(prefers-reduced-motion:reduce){.screen{transition:none}}
</style>
</head>
<body>
<main><svg id="wireframes" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg" aria-label="Ten outline-only geometric interface wireframes. Click a screen to inspect and press Escape to return."></svg></main>
<script>
/* All geometry is original, SVG-native, and generated locally. No fonts, imagery,
   gradients, labels, color fills, libraries, or canvas rasterization are involved. */
'use strict';
const svg=document.getElementById('wireframes');
const NS='http://www.w3.org/2000/svg';
const make=(parent,tag,props={})=>{const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(props))if(v!==undefined&&v!==null)e.setAttribute(k,String(v));parent.append(e);return e};
const path=(g,d,kind='wire',attrs={})=>make(g,'path',{d,class:kind,...attrs});
const rect=(g,x,y,w,h,rx=0,kind='wire')=>make(g,'rect',{x,y,width:w,height:h,rx,class:kind});
const line=(g,x,y,x2,y2,kind='wire')=>make(g,'line',{x1:x,y1:y,x2,y2,class:kind});
const circle=(g,cx,cy,r,kind='wire')=>make(g,'circle',{cx,cy,r,class:kind});
const poly=(g,points,kind='wire')=>make(g,'polygon',{points:points.map(a=>a.join(',')).join(' '),class:kind});
const bars=(g,x,y,lengths,step=11,kind='wire')=>lengths.forEach((len,i)=>line(g,x,y+i*step,x+len,y+i*step,kind));
const dots=(g,x,y,n=7,spacing=8,r=1.1)=>{for(let i=0;i<n;i++)circle(g,x+i*spacing,y,r,'solid')};
const bevel=(g,x,y,w,h,c=9,kind='wire')=>path(g,`M ${x+c} ${y} H ${x+w-c} L ${x+w} ${y+c} V ${y+h-c} L ${x+w-c} ${y+h} H ${x+c} L ${x} ${y+h-c} V ${y+c} Z`,kind);
function machined(g,x,y,w,h,corner=12){
  const p=[[x+corner,y],[x+w-20,y],[x+w,y+20],[x+w,y+h-corner],[x+w-corner,y+h],[x+20,y+h],[x,y+h-20],[x,y+corner]];
  poly(g,p,'wire');
  path(g,`M ${x+corner+5} ${y+5} H ${x+w-26} L ${x+w-5} ${y+26} V ${y+h-20}`,'hair');
  path(g,`M ${x+13} ${y+21} V ${y+h-26} L ${x+27} ${y+h-10} H ${x+w-28}`,'hair');
}
function slot(g,x,y,w,h=16,kind='wire'){bevel(g,x,y,w,h,Math.min(7,h/2.5),kind)}
function screw(g,x,y,r=5){circle(g,x,y,r,'wire');line(g,x-r*.45,y+r*.45,x+r*.45,y-r*.45,'hair')}
function chevron(g,x,y,s=5,direction=1){path(g,`M ${x-s*direction} ${y-s} L ${x} ${y} L ${x-s*direction} ${y+s}`,'wire')}
function folder(g,x,y,s=1){path(g,`M ${x} ${y+7*s} H ${x+11*s} L ${x+15*s} ${y+2*s} H ${x+33*s} L ${x+38*s} ${y+8*s} V ${y+29*s} H ${x} Z`,'wire');line(g,x+2*s,y+12*s,x+36*s,y+12*s,'hair')}
function fileIcon(g,x,y,w=23,h=30){path(g,`M ${x+3} ${y} H ${x+w-9} L ${x+w} ${y+9} V ${y+h} H ${x+3} Z`,'wire');path(g,`M ${x+w-9} ${y} V ${y+9} H ${x+w}`,'hair');bars(g,x+8,y+15,[w-15,w-17],6,'hair')}
function magnify(g,x,y,r=5){circle(g,x,y,r,'wire');line(g,x+r*.75,y+r*.75,x+r*1.7,y+r*1.7,'wire')}
function gridIcon(g,x,y,s=7,gap=3){for(let a=0;a<2;a++)for(let b=0;b<2;b++)rect(g,x+(s+gap)*a,y+(s+gap)*b,s,s,1,'wire')}
function chip(g,x,y,w,h=21,sel=false){slot(g,x,y,w,h,sel?'heavy':'hair');if(sel)line(g,x+10,y+h-3,x+w-10,y+h-3,'wire')}
function toggle(g,x,y,w=35,h=17,active=false){rect(g,x,y,w,h,h/2,'wire');circle(g,x+(active?w-h/2:h/2),y+h/2,h/2-3,'wire')}
function checkbox(g,x,y,size=13,checked=false){bevel(g,x,y,size,size,2,checked?'heavy':'wire');if(checked)path(g,`M ${x+2} ${y+size*.5} L ${x+size*.43} ${y+size-2} L ${x+size-2} ${y+2}`,'wire')}
function placeholder(g,x,y,w,h=8,extra=false){line(g,x,y,x+w,y,'wire');if(extra)line(g,x,y+h,x+w*.65,y+h,'hair')}
function rail(g,x1,y1,x2,y2){line(g,x1,y1,x2,y2,'wire');line(g,x1,y1+4,x2,y2+4,'hair')}
function ring(g,x,y,r,portion=.72){circle(g,x,y,r,'wire');circle(g,x,y,r-11,'hair');make(g,'circle',{cx:x,cy:y,r:r-5,fill:'none',stroke:'#111','stroke-width':4,'stroke-dasharray':`${2*Math.PI*(r-5)*portion} ${2*Math.PI*(r-5)*(1-portion)}`,transform:`rotate(-90 ${x} ${y})`})}
function frame(g,w,h,type='normal'){
  const isTall=h>=380, c=isTall?30:23;
  const pts=[
    [c,3],[w*.30,3],[w*.33,18],[w*.45,18],[w*.47,7],

  ];
  if(type==='settings')pts.splice(3,2,[w*.42,18],[w*.44,3]);
  poly(g,pts,'heavy');
  path(g,`M 18 43 L 38 13 H ${w*.295} L ${w*.325} 28 H ${w*.45} L ${w*.475} 15 H ${w*.775} L ${w*.806} 35 H ${w-40} L ${w-15} 58 V ${h-49}`,'hair');
  path(g,`M 14 ${h-73} V ${h-47} L 52 ${h-11} H ${w*.354} L ${w*.381} ${h-30} H ${w*.765} L ${w*.797} ${h-18} H ${w-33}`,'hair');
  path(g,`M ${w*.30+3} 6 L ${w*.328} 24 M ${w*.776} 12 L ${w*.803} 31 M 9 ${h-67} L 21 ${h-79}`,'wire');

  if(h>260){screw(g,30,32,6);screw(g,w-26,50,6);screw(g,30,h-37,6);screw(g,w-29,h-37,6)}

  dots(g,w*.68,h-16,10,6,.7);
  for(let i=0;i<4;i++)line(g,w*.22+i*18,14,w*.22+i*18+10,14,'hair');
  for(let i=0;i<4;i++)line(g,w-82+i*15,h-17,w-72+i*15,h-17,'hair');
}
function topChrome(g,w,sidebar=150){

  const a=w*.425,b=w*.695;
  path(g,`M ${a-33} 6 L ${a-13} 29 H ${a} L ${a+14} 11 H ${b-22} L ${b-3} 25 L ${b-16} 49 H ${a+18} L ${a} 38 H ${a-18} Z`,'wire');
  path(g,`M ${a+13} 30 L ${a+27} 18 H ${b-30} L ${b-17} 28 L ${b-28} 39 H ${a+27} Z`,'hair');
  circle(g,a+33,28,9,'wire');circle(g,a+33,28,3,'wire');
  bars(g,a+50,24,[70,55],9,'hair');
  slot(g,w-160,15,112,24,'hair');magnify(g,w-146,27,4);line(g,w-132,27,w-80,27,'hair');
  for(let i=0;i<3;i++){bevel(g,w-42+i*11,18,9,19,2,'hair')}

  slot(g,75,17,25,18,'hair');dots(g,110,26,4,8,1);

function insideRows(g,items){for(const v of items){const {x,y,w,h,selected=false,kind='folder'}=v;if(selected)bevel(g,x,y,w,h,5,'heavy');else line(g,x+3,y+h,x+w-5,y+h,'hair');checkbox(g,x+7,y+h/2-6,12,false);if(kind==='folder')folder(g,x+29,y+6,.58);else fileIcon(g,x+31,y+5,17,21);bars(g,x+65,y+8,[Math.max(35,w*.18),Math.max(22,w*.1)],11,'hair');for(const xx of [x+w*.5,x+w*.65,x+w*.81])line(g,xx,y+12,xx+Math.min(38,w*.11),y+12,'hair');}}

 for(let i=0;i<4;i++)circle(g,755,142+i*14,2.4,'wire');

function duplicates(g,w,h){frame(g,w,h);
 path(g,'M 52 26 H 290 L 310 42 H 505','wire');
 bars(g,48,51,[123],1,'heavy');
 for(let i=0;i<5;i++)chip(g,47+[0,56,111,184,274][i],74,[48,48,64,81,68][i],22,i===0);

for(const spec of screens){
 const wrapper=make(svg,'g',{class:'screen',role:'button',tabindex:0,'aria-label':spec.name+' shape layout','data-name':spec.name});
 const transformed=make(wrapper,'g',{transform:`translate(${spec.x} ${spec.y}) scale(${spec.w/spec.bw} ${spec.h/spec.bh})`});
 spec.draw(transformed,spec.bw,spec.bh);
 make(wrapper,'rect',{x:spec.x,y:spec.y,width:spec.w,height:spec.h,class:'focus-ring'});
 wrapper.addEventListener('click',()=>toggleZoom(spec));
 wrapper.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleZoom(spec)}});
}
// Geometry-only inspection: single-click a screen to magnify it, click again
// or Escape to return. This does not add onscreen UI, labels, or color.
let active=null,raf=0;
const defaultBox=[0,0,1672,941];
function goTo(box){
 cancelAnimationFrame(raf);
 const start=svg.viewBox.baseVal;
 const from=[start.x,start.y,start.width,start.height];
 const then=performance.now(),duration=270;
 const ease=t=>1-Math.pow(1-t,3);
 function tick(now){const p=Math.min(1,(now-then)/duration),a=ease(p);const b=from.map((v,i)=>v+(box[i]-v)*a);svg.setAttribute('viewBox',b.join(' '));if(p<1)raf=requestAnimationFrame(tick)}
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)svg.setAttribute('viewBox',box.join(' '));
 else raf=requestAnimationFrame(tick);
}
function toggleZoom(spec){
 if(active===spec.name){active=null;goTo(defaultBox);return}
 active=spec.name;
 const margin=spec.h>300?26:19;
 const x=spec.x-margin,y=spec.y-margin,w=spec.w+2*margin,h=spec.h+2*margin;
 // The target keeps the original panel aspect, without stretching the shapes.
 let target=[x,y,w,h];
 const canvasRatio=1672/941;
 if(w/h>canvasRatio){const hh=w/canvasRatio;target=[x,y-(hh-h)/2,w,hh]}
 else {const ww=h*canvasRatio;target=[x-(ww-w)/2,y,ww,h]}
 goTo(target);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&active){active=null;goTo(defaultBox)}});
svg.addEventListener('click',e=>{if(e.target===svg&&active){active=null;goTo(defaultBox)}});
</script>
